<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puente Laboral - Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark navbar-portal">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-briefcase-fill"></i> Puente Laboral</a>
        <a href="index.html" class="btn btn-outline-light btn-sm">Volver al inicio</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4">
                <h2 class="fw-bold text-azul text-center">Iniciar sesión</h2>
                <p class="text-muted text-center">Selecciona tu tipo de cuenta</p>

                <ul class="nav nav-pills nav-fill mb-4">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#candidato" type="button">Candidato</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#empresa" type="button">Empresa</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#admin" type="button">Administrador</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <form class="tab-pane fade show active" id="candidato" method="post" data-rol="candidato">
                        <div class="mensaje d-none"></div>
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="correo" class="form-control mb-3" placeholder="correo@ejemplo.com" required>
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="clave" class="form-control mb-3" minlength="8" required>
                        <div class="d-flex justify-content-between mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="recordar">
                                <label class="form-check-label" for="recordar">Recordarme</label>
                            </div>
                            <a href="#" class="small">¿Olvidaste tu contraseña?</a>
                        </div>
                        <button type="submit" class="btn btn-verde w-100">Ingresar</button>
                    </form>

                    <form class="tab-pane fade" id="empresa" method="post" data-rol="empresa">
                        <div class="mensaje d-none"></div>
                        <label class="form-label">Correo de la empresa</label>
                        <input type="email" name="correo" class="form-control mb-3" placeholder="rrhh@empresa.com" required>
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="clave" class="form-control mb-3" minlength="8" required>
                        <button type="submit" class="btn btn-azul w-100">Ingresar como empresa</button>
                    </form>

                    <form class="tab-pane fade" id="admin" method="post" data-rol="admin">
                        <div class="mensaje d-none"></div>
                        <label class="form-label">Correo del administrador</label>
                        <input type="email" name="correo" class="form-control mb-3" placeholder="admin@puentelaboral.com" required>
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="clave" class="form-control mb-3" minlength="8" required>
                        <button type="submit" class="btn btn-dark w-100">Ingresar al panel</button>
                    </form>
                </div>

                <p class="text-center small mt-4 mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
