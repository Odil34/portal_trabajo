<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puente Laboral - Buscar empleo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-portal">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-briefcase-fill"></i> Puente Laboral</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="busqueda.html">Buscar empleo</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Publicar empleos</a></li>
                <li class="nav-item"><a class="nav-link" href="recursos.html">Recursos</a></li>
                <li class="nav-item"><a class="nav-link" href="valoraciones.html">Valoraciones</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Mi perfil</a></li>
            </ul>
            <div class="d-flex gap-2">
                <a href="login.html" class="btn btn-outline-light">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-verde">Registrarse</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-3">
            <form class="card p-3" id="formFiltrosBusqueda" action="busqueda.html">
                <h5 class="fw-bold text-azul">Buscar empleos</h5>

                <label class="form-label mt-3" for="buscar">Puesto, palabra clave o empresa</label>
                <input class="form-control" type="text" name="buscar" id="buscar" placeholder="Ej. Desarrollador">

                <label class="form-label mt-3" for="departamentoTexto">Departamento</label>
                <div class="catalogo-buscable" id="catalogoDepartamento">
                    <input class="form-control catalogo-entrada" type="text" id="departamentoTexto"
                           placeholder="Todo el país" autocomplete="off" role="combobox"
                           aria-expanded="false" aria-controls="opcionesDepartamento">
                    <input type="hidden" name="departamento" id="departamento">
                    <div class="catalogo-opciones" id="opcionesDepartamento" role="listbox"></div>
                </div>

                <label class="form-label mt-3" for="distritoTexto">Distrito</label>
                <div class="catalogo-buscable" id="catalogoDistrito">
                    <input class="form-control catalogo-entrada" type="text" id="distritoTexto"
                           placeholder="Primero selecciona un departamento" autocomplete="off"
                           role="combobox" aria-expanded="false" aria-controls="opcionesDistrito" disabled>
                    <input type="hidden" name="distrito" id="distrito">
                    <div class="catalogo-opciones" id="opcionesDistrito" role="listbox"></div>
                </div>

                <label class="form-label mt-3" for="modalidad">Modalidad</label>
                <select class="form-select" name="modalidad" id="modalidad">
                    <option value="">Todas las modalidades</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Híbrido">Híbrido</option>
                    <option value="Remoto">Remoto</option>
                </select>

                <label class="form-label mt-3" for="sector">Sector</label>
                <select class="form-select" name="sector" id="sector">
                    <option value="">Todos los sectores</option>
                </select>

                <label class="form-label mt-3" for="experiencia">Experiencia</label>
                <select class="form-select" name="experiencia" id="experiencia">
                    <option value="">Cualquier experiencia</option>
                    <option value="Sin experiencia">Sin experiencia</option>
                    <option value="1 - 2 años">1 - 2 años</option>
                    <option value="Más de 3 años">Más de 3 años</option>
                </select>

                <label class="form-label mt-3" for="tipoContrato">Tipo de contrato</label>
                <select class="form-select" name="tipoContrato" id="tipoContrato">
                    <option value="">Todos los contratos</option>
                    <option value="Indefinido">Indefinido</option>
                    <option value="Temporal">Temporal</option>
                    <option value="Pasantía">Pasantía</option>
                </select>

                <label class="form-label mt-3" for="tipoTrabajo">Tipo de trabajo</label>
                <select class="form-select" name="tipoTrabajo" id="tipoTrabajo">
                    <option value="">Todos</option>
                    <option value="Tiempo completo">Tiempo completo</option>
                    <option value="Medio tiempo">Medio tiempo</option>
                </select>

                <label class="form-label mt-3" for="salarioMinimo">Salario mínimo</label>
                <select class="form-select" name="salarioMinimo" id="salarioMinimo">
                    <option value="">Cualquier salario</option>
                    <option value="500">Desde $500</option>
                    <option value="1000">Desde $1,000</option>
                    <option value="1500">Desde $1,500</option>
                </select>

                <label class="form-label mt-3" for="orden">Ordenar por</label>
                <select class="form-select" name="orden" id="orden">
                    <option value="">Más recientes</option>
                    <option value="salario">Mayor salario</option>
                </select>

                <button type="submit" class="btn btn-azul mt-3">Aplicar filtros</button>
                <a href="busqueda.html" class="btn btn-outline-secondary mt-2">Limpiar filtros</a>
            </form>
        </div>

        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0" id="tituloResultados">Cargando empleos...</h5>
            </div>
            <div id="resultadosOfertas">
                <p class="text-muted">Consultando ofertas disponibles...</p>
            </div>
            <nav aria-label="Paginacion de resultados">
                <ul class="pagination justify-content-center" id="paginacionOfertas"></ul>
            </nav>
        </div>
    </div>
</main>

<footer class="text-white-50 py-4">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <p class="mb-0">© 2026 Puente Laboral</p>
        <div class="d-flex gap-3">
            <a href="busqueda.html">Empleos</a>
            <a href="recursos.html">Recursos</a>
            <a href="valoraciones.html">Valoraciones</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/busqueda.js"></script>
</body>
</html>
